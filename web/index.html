<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <!-- Home screen: standalone; App.tsx pads the safe area. No black-translucent status bar: under it iOS sizes the
         viewport a status bar short at launch and full later, so the bottom line floated or the page scrolled. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ultimate" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#111112" />
    <title>Ultimate</title>
    <style>
      html {
        background: var(--background, oklch(0.985 0.002 270));
      }
      html.dark {
        background: var(--background, oklch(0.178 0.003 270));
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      {
        const themes = {
          'ultimate-dark': ['dark', '#111112'],
          'cursor-dark': ['dark', '#141414'],
          rose: ['dark', '#161011'],
          'catppuccin-mocha': ['dark', '#1e1e2e'],
          gruvbox: ['dark', '#282828'],
          dracula: ['dark', '#282a36'],
          'tokyo-night': ['dark', '#1a1b26'],
          nord: ['dark', '#2e3440'],
          'one-dark': ['dark', '#282c34'],
          'solarized-dark': ['dark', '#002b36'],
          'github-dark': ['dark', '#0d1117'],
          'ultimate-light': ['light', '#f9fafb'],
          'warm-light': ['light', '#faf7f2'],
          'catppuccin-latte': ['light', '#eff1f5'],
          'gruvbox-light': ['light', '#fbf1c7'],
          'solarized-light': ['light', '#fdf6e3'],
          'github-light': ['light', '#ffffff'],
        }
        const sansFallback = "'Inter Variable', Inter, ui-sans-serif, system-ui, sans-serif"
        const monoFallback =
          "'JetBrains Mono', 'JetBrainsMono Nerd Font', 'JetBrainsMono NF', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        const uiFonts = {
          inter: sansFallback,
          system: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
          'dm-sans': `"DM Sans", ${sansFallback}`,
          manrope: `"Manrope", ${sansFallback}`,
          'ibm-plex-mono': `"IBM Plex Mono", ${monoFallback}`,
          jetbrains: `"JetBrainsMono Nerd Font", "JetBrains Mono", ${monoFallback}`,
          'jetbrains-nl': `"JetBrainsMonoNL Nerd Font", "JetBrains Mono NL", ${monoFallback}`,
          mononoki: `"Mononoki Nerd Font", "Mononoki", ${monoFallback}`,
          firacode: `"FiraCode Nerd Font", "Fira Code", ${monoFallback}`,
          hack: `"Hack Nerd Font", "Hack", ${monoFallback}`,
          dankmono: `"DankMono Nerd Font", "Dank Mono", ${monoFallback}`,
        }
        const codeFonts = {
          'jetbrains-mono': monoFallback,
          jetbrains: `"JetBrainsMono Nerd Font", "JetBrainsMono NF", ${monoFallback}`,
          'jetbrains-nl': `"JetBrainsMonoNL Nerd Font", "JetBrains Mono NL", ${monoFallback}`,
          'ibm-plex-mono': `"IBM Plex Mono", ${monoFallback}`,
          firacode: `"FiraCode Nerd Font", "Fira Code", ${monoFallback}`,
          hack: `"Hack Nerd Font", "Hack", ${monoFallback}`,
          mononoki: `"Mononoki Nerd Font", "Mononoki", ${monoFallback}`,
          dankmono: `"DankMono Nerd Font", "Dank Mono", ${monoFallback}`,
          'system-mono': "ui-monospace, 'SF Mono', Menlo, Consolas, monospace",
        }
        const root = document.documentElement
        const storedPolarity = localStorage.getItem('ultimate.theme')
        const rawPolarity =
          storedPolarity === 'light' || storedPolarity === 'dark'
            ? storedPolarity
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        const rawPreset = localStorage.getItem('ultimate.theme.preset')
        const preset =
          rawPreset && themes[rawPreset] && themes[rawPreset][0] === rawPolarity
            ? rawPreset
            : rawPolarity === 'light'
              ? 'ultimate-light'
              : 'ultimate-dark'
        const [polarity, color] = themes[preset]
        root.dataset.theme = preset
        root.classList.toggle('dark', polarity === 'dark')
        root.style.setProperty('--theme-preset', preset)
        document.querySelector('meta[name=theme-color]').content = color
        const uiFont = localStorage.getItem('ultimate.font.ui')
        if (uiFont && uiFonts[uiFont]) root.style.setProperty('--font-sans', uiFonts[uiFont])
        const codeFont = localStorage.getItem('ultimate.font.code')
        if (codeFont && codeFonts[codeFont])
          root.style.setProperty('--font-mono', codeFonts[codeFont])
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // A reload paints the page as it last looked until the app has rendered again (web/src/sdk/resume.ts).
      {
        const resume = JSON.parse(sessionStorage.getItem('ultimate.resume') ?? 'null')
        if (resume && Date.now() - resume.at < 30000) {
          const view = document.createElement('div')
          view.id = 'resume'
          view.inert = true
          view.style.cssText =
            'position:fixed;inset:0;z-index:2147483647;background:var(--background)'
          // The frame stays as the page that went away looked: sharp, until the app beneath shows the same again.
          const frame = document.createElement('div')
          frame.style.cssText = 'position:absolute;inset:0'
          frame.innerHTML = resume.html
          const style = document.createElement('style')
          // Offscreen content sizes itself only once rendered: lay it all out now, so the scroll offsets land.
          style.textContent = `${resume.css}
            #resume * { content-visibility: visible !important; }`
          view.append(style, frame)
          document.body.append(view)
          for (const element of view.querySelectorAll('[data-resume-scroll]')) {
            const [top, left] = element.dataset.resumeScroll.split(',')
            element.scrollTop = top
            element.scrollLeft = left
          }
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
